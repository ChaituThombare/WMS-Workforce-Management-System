<h2 class="fw-bold text-dark mb-4">Clients</h2>

<div class="form-card">
    <div class="card-body">
        <h4 class="mb-4">
            {{ isEditMode ? 'Edit Client' : 'Add Client' }}
        </h4>

        <div class="row g-3">

            <div class="col-md-6">
                <label class="form-label">Client Name</label>
                <input
                    type="text"
                    class="form-control"
                    [(ngModel)]="clientData.clientName">
            </div>

            <div class="col-md-6">
                <label class="form-label">Client Address</label>
                <input
                    type="text"
                    class="form-control"
                    [(ngModel)]="clientData.clientAddress">
            </div>

            <div class="col-md-6">
                <label class="form-label">Phone Number</label>
                <input
                    type="text"
                    class="form-control"
                    [(ngModel)]="clientData.clientPhoneNumber">
            </div>

            <div class="col-md-6">
                <label class="form-label">Location</label>
                <input
                    type="text"
                    class="form-control"
                    [(ngModel)]="clientData.clientLocation">
            </div>

            <div class="col-md-6">
                <label class="form-label">Status</label>
                <select class="form-control" [(ngModel)]="clientData.status">
                    <option [ngValue]="true">Active</option>
                    <option [ngValue]="false">Inactive</option>
                </select>
            </div>

            <div class="col-md-12">
                <button class="btn btn-primary me-2" (click)="saveClient()">
                    {{ isEditMode ? 'Update Client' : 'Add Client' }}
                </button>

                <button *ngIf="isEditMode" class="btn btn-secondary" (click)="cancelEdit()">
                    Cancel
                </button>
            </div>

        </div>
    </div>
</div>

<div class="table-responsive">
    <table class="table table-hover align-middle shadow-sm">
        <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Address</th>
                <th>Phone</th>
                <th>Location</th>
                <th>Status</th>
                <th>Action</th>
            </tr>
        </thead>
    
        <tbody>
            <tr *ngFor="let client of clients">
                <td>{{ client.clientId }}</td>
                <td>{{ client.clientName }}</td>
                <td>{{ client.clientAddress }}</td>
                <td>{{ client.clientPhoneNumber }}</td>
                <td>{{ client.clientLocation }}</td>
                <td>
                    <span
                    [ngClass]="{
                        'badge-active': client.status === true,
                        'badge-inactive': client.status === false
                    }">
                    {{ client.status ? 'Active' : 'Inactive' }}
                    </span>
                </td>
                <td>
                    <button class="btn btn-warning btn-sm me-2" (click)="editClient(client)">
                        Edit
                    </button>
    
                    <button class="btn btn-danger btn-sm" (click)="deleteClient(client.clientId)">
                        Delete
                    </button>
                </td>
            </tr>
            <tr *ngIf="clients.length === 0">
                <td colspan="7" class="text-center text-muted">
                    No records found
                </td>
            </tr>
        </tbody>
    </table>
</div>
