<h2 class="fw-bold text-dark mb-4">My Projects</h2>

<div class="table-responsive">
    <table class="table table-hover align-middle shadow-sm">
        <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Project Name</th>
                <th>Assigned On</th>
                <th>Allocated By</th>
                <th>Status</th>
            </tr>
        </thead>

        <tbody>
            <tr *ngFor="let allocation of allocations">
                <td>{{ allocation.allocationId }}</td>
                <td>{{ allocation.projectName }}</td>
                <td>{{ allocation.assignedOn | date: 'dd-MM-yyyy hh:mm a' }}</td>
                <td>{{ allocation.createdBy }}</td>
                <td>
                    <span [ngClass]="allocation.status ? 'badge-active' : 'badge-cancelled'">
                        {{ allocation.status ? 'Active' : 'Deallocated' }}
                    </span>
                </td>
            </tr>
            <tr *ngIf="allocations.length === 0">
                <td colspan="5" class="text-center text-muted">
                    No project allocations found.
                </td>
            </tr>
        </tbody>
    </table>
</div>
