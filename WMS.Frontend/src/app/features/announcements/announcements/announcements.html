<h2 class="fw-bold text-dark mb-4">Announcements</h2>

<div *ngIf="isAdmin()" class="form-card mb-4">
    <h4>Create Announcement</h4>

    <div class="row g-3">
        <div class="col-md-6">
            <input
                type="text"
                class="form-control"
                placeholder="Announcement title"
                [(ngModel)]="announcementData.title">
        </div>

        <div class="col-md-12">
            <textarea
                class="form-control"
                rows="4"
                placeholder="Announcement message"
                [(ngModel)]="announcementData.message">
            </textarea>
        </div>

        <div class="col-md-12">
            <button
                class="btn btn-primary"
                (click)="createAnnouncement()">
                Post Announcement
            </button>
        </div>
    </div>
</div>

<div *ngFor="let announcement of announcements" class="card dashboard-card mb-3">
    <div class="card-body">
        <h4>{{ announcement.title }}</h4>

        <p>{{ announcement.message }}</p>

        <small class="text-muted">
            By {{ announcement.createdBy }}
            |
            {{ announcement.createdOn | date:'dd-MM-yyyy hh:mm a' }}
        </small>

        <div class="mt-3 d-flex align-items-center gap-2">    
            <span 
                class="badge px-3 py-2 fs-6"
                [ngClass]="announcement.isActive ? 'bg-success text-white' : 'bg-secondary text-white'">
                    {{ announcement.isActive ? 'Active' : 'Inactive' }}
            </span>

            <button
                *ngIf="isAdmin()"
                class="btn btn-sm px-3 py-2 fw-semibold ms-3"
                [ngClass]="announcement.isActive ? 'btn-outline-danger' : 'btn-outline-success'"
                (click)="toggleStatus(announcement.announcementId)">
                    {{ announcement.isActive ? 'Deactivate' : 'Activate' }}
            </button>
        
        </div>
    </div>
</div>

<div *ngIf="announcements.length === 0" class="alert alert-info">
    No announcements available.
</div>
