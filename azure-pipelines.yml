trigger:
  branches:
    include:
      - dev
  paths:
    include:
      - WMS.API/*
      - WMS.API/**
      - WMS.Tests/*
      - WMS.Tests/**
      - WMS-Solution.sln
    exclude:
      - WMS.Frontend/*
      - WMS.Frontend/**

pool:
  vmImage: 'ubuntu-latest'

variables:
  buildConfiguration: 'Release'
  azureSubscription: 'azure-wms-connection'
  webAppName: 'wms-sql-chaitanya09'

steps:

- checkout: self
  clean: true

- task: UseDotNet@2
  displayName: 'Install .NET 8 SDK'
  inputs:
    packageType: 'sdk'
    version: '8.0.x'

- script: dotnet restore WMS-Solution.sln
  displayName: 'Restore NuGet Packages'

- script: dotnet build WMS-Solution.sln --configuration $(buildConfiguration) --no-restore
  displayName: 'Build Solution'

- script: dotnet test WMS.Tests/WMS.Tests.csproj --configuration $(buildConfiguration) --no-build --verbosity normal
  displayName: 'Run Unit Tests'
  condition: succeededOrFailed()

- task: DotNetCoreCLI@2
  displayName: 'Publish API'
  inputs:
    command: 'publish'
    publishWebProjects: false
    projects: 'WMS.API/WMS.API.csproj'
    arguments: '--configuration $(buildConfiguration) --output $(Build.ArtifactStagingDirectory)/publish'
    zipAfterPublish: true

- task: AzureWebApp@1
  displayName: 'Deploy API to Azure App Service'
  inputs:
    azureSubscription: '$(azureSubscription)'
    appType: 'webApp'
    appName: '$(webAppName)'
    package: '$(Build.ArtifactStagingDirectory)/publish/*.zip'