trigger:
- dev

pool:
  vmImage: 'windows-latest'

variables:
  buildConfiguration: 'Release'
  azureSubscription: 'azure-wms-connection'
  webAppName: 'wms-sql-chaitanya09'

steps:

- checkout: self
  clean: true

- task: UseDotNet@2
  displayName: 'Install .NET 8 SDK'
  inputs:
    packageType: sdk
    version: '8.0.x'

- script: |
    dir
    dotnet restore WMS-Solution.sln
  displayName: 'Restore NuGet Packages'

- script: |
    dotnet build WMS-Solution.sln --configuration $(buildConfiguration) --no-restore
  displayName: 'Build Solution'

- script: |
    dotnet test WMS.Tests/WMS.Tests.csproj --configuration $(buildConfiguration) --no-build
  displayName: 'Run Unit Tests'

- script: |
    dotnet publish WMS.API/WMS.API.csproj --configuration $(buildConfiguration) --output $(Build.ArtifactStagingDirectory)
  displayName: 'Publish API'

- task: AzureWebApp@1
  displayName: 'Deploy API to Azure App Service'
  inputs:
    azureSubscription: '$(azureSubscription)'
    appType: 'webApp'
    appName: '$(webAppName)'
    package: '$(Build.ArtifactStagingDirectory)'